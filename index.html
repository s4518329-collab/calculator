<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Square Black & Orange Calculator</title>
  
  <!-- External stylesheet link -->
  <link rel="stylesheet" href="style.css" />

  <!-- Google Fonts: Space Grotesk & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       STYLE: STRICT 1:1 SQUARE SHAPE BOX - BLACK & ORANGE CALCULATOR
       ========================================================================== */
    :root {
      --box-size: min(94vw, 430px);
      --box-radius: 0px;
      --key-radius: 0px;
      --grid-gap: 7px;

      --color-black-bg: #000000;
      --color-chassis: #0a0a0c;
      --color-screen: #030304;

      --color-orange-glow: rgba(255, 106, 0, 0.45);
      --color-orange-main: #ff6a00;
      --color-orange-bright: #ff7d1a;
      --color-orange-dark: #cc5500;
      --color-orange-text: #ff9d5c;

      --btn-num-bg: #141417;
      --btn-num-border: #2c2c32;
      --btn-num-text: #ffffff;
      --btn-num-hover: #222228;

      --btn-action-bg: #1a1410;
      --btn-action-border: #ff7d1a;
      --btn-action-text: #ff851b;

      --btn-op-bg: #ff6a00;
      --btn-op-border: #ff9d5c;
      --btn-op-text: #000000;

      --font-ui: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--color-black-bg);
      background: 
        radial-gradient(circle at 50% 25%, rgba(255, 106, 0, 0.32) 0%, rgba(20, 8, 0, 0.85) 55%, var(--color-black-bg) 92%),
        linear-gradient(135deg, #000000 0%, #0d0500 45%, #1f0b00 75%, #000000 100%);
      color: #ffffff;
      padding: 16px;
      user-select: none;
      overflow-x: hidden;
    }

    /* Strict 1:1 Square Shape Box Chassis */
    .calculator-box {
      width: var(--box-size);
      aspect-ratio: 1 / 1;
      background-color: var(--color-chassis);
      border: 3px solid var(--color-orange-main);
      border-radius: var(--box-radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 
        0 25px 65px rgba(0, 0, 0, 0.98),
        0 0 40px var(--color-orange-glow),
        inset 0 0 25px rgba(0, 0, 0, 0.9);
      position: relative;
    }

    .calculator-box::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--color-orange-main);
      box-shadow: 0 0 12px var(--color-orange-main);
    }

    .calculator-header {
      height: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .brand-tag {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      background-color: var(--color-orange-main);
      border-radius: 0;
      box-shadow: 0 0 8px var(--color-orange-main);
      display: inline-block;
    }

    .brand-text {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--color-orange-main);
      text-transform: uppercase;
    }

    .accent-stripe {
      width: 36px;
      height: 4px;
      background-color: var(--color-orange-main);
    }

    .display-container {
      height: 74px;
      background-color: var(--color-screen);
      border: 2px solid rgba(255, 106, 0, 0.45);
      border-radius: var(--box-radius);
      padding: 6px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      text-align: right;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.9);
    }

    .display-history {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      color: var(--color-orange-text);
      min-height: 1.2rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .display-current {
      font-family: var(--font-mono);
      font-size: 2.15rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
      letter-spacing: -0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .keypad-grid {
      flex: 1;
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: var(--grid-gap);
    }

    .key {
      font-family: var(--font-ui);
      font-size: 1.3rem;
      font-weight: 700;
      border-radius: var(--key-radius);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      outline: none;
      transition: 
        background-color 0.1s ease,
        border-color 0.1s ease,
        transform 0.06s ease,
        box-shadow 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .key:active {
      transform: scale(0.95);
    }

    .key:focus-visible {
      outline: 2px solid var(--color-orange-main);
      outline-offset: 2px;
    }

    .key-number {
      background-color: var(--btn-num-bg);
      color: var(--btn-num-text);
      border: 2px solid var(--btn-num-border);
    }

    .key-number:hover {
      background-color: var(--btn-num-hover);
      border-color: var(--color-orange-main);
      box-shadow: 0 0 10px rgba(255, 106, 0, 0.25);
    }

    .key-number:active {
      background-color: #303038;
    }

    .key-action {
      background-color: var(--btn-action-bg);
      color: var(--btn-action-text);
      border: 2px solid var(--btn-action-border);
      font-size: 1.15rem;
    }

    .key-action:hover {
      background-color: var(--color-orange-main);
      color: #000000;
      box-shadow: 0 0 14px var(--color-orange-glow);
    }

    .key-action:active {
      background-color: var(--color-orange-dark);
    }

    .key-operator {
      background-color: var(--btn-op-bg);
      color: var(--btn-op-text);
      border: 2px solid var(--btn-op-border);
      font-size: 1.6rem;
      font-weight: 800;
      box-shadow: 0 2px 10px rgba(255, 106, 0, 0.35);
    }

    .key-operator:hover {
      background-color: var(--color-orange-bright);
      border-color: #ffffff;
      box-shadow: 0 0 16px var(--color-orange-glow);
    }

    .key-operator:active {
      background-color: var(--color-orange-dark);
    }

    .key-equals {
      background-color: var(--color-orange-main);
      color: #000000;
      border: 2px solid #ffffff;
      font-size: 1.7rem;
      font-weight: 800;
      box-shadow: 0 0 18px var(--color-orange-glow);
    }

    .key-equals:hover {
      background-color: var(--color-orange-bright);
      box-shadow: 0 0 22px rgba(255, 106, 0, 0.6);
    }

    .key-equals:active {
      background-color: var(--color-orange-dark);
    }

    @media (max-width: 380px) {
      :root {
        --box-size: 96vw;
        --grid-gap: 5px;
      }
      .calculator-box {
        padding: 12px;
      }
      .display-container {
        height: 64px;
        padding: 4px 8px;
      }
      .display-current {
        font-size: 1.8rem;
      }
      .key {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Strict 1:1 Square Shape Box -->
  <main class="calculator-box" role="region" aria-label="Square Black and Orange Calculator">
    
    <!-- Top Model Header Bar -->
    <header class="calculator-header">
      <div class="brand-tag">
        <span class="status-indicator"></span>
        <span class="brand-text">APEX-90</span>
      </div>
      <div class="accent-stripe" aria-hidden="true"></div>
    </header>

    <!-- Recessed Digital Screen -->
    <section class="display-container" aria-live="polite">
      <div class="display-history" id="previousOperand"></div>
      <div class="display-current" id="currentOperand">0</div>
    </section>

    <!-- Keypad: 4x5 Symmetrical Square Grid with Visible Buttons -->
    <section class="keypad-grid" role="group" aria-label="Calculator keypad">
      <!-- Row 1: Actions & Division -->
      <button type="button" class="key key-action" data-action="clear" title="All Clear (Esc)">AC</button>
      <button type="button" class="key key-action" data-action="toggle-sign" title="Toggle Sign (±)">±</button>
      <button type="button" class="key key-action" data-action="percent" title="Percentage (%)">%</button>
      <button type="button" class="key key-operator" data-operator="/" title="Divide (/)">÷</button>

      <!-- Row 2: 7, 8, 9, Multiply -->
      <button type="button" class="key key-number" data-number="7">7</button>
      <button type="button" class="key key-number" data-number="8">8</button>
      <button type="button" class="key key-number" data-number="9">9</button>
      <button type="button" class="key key-operator" data-operator="*" title="Multiply (*)">×</button>

      <!-- Row 3: 4, 5, 6, Subtract -->
      <button type="button" class="key key-number" data-number="4">4</button>
      <button type="button" class="key key-number" data-number="5">5</button>
      <button type="button" class="key key-number" data-number="6">6</button>
      <button type="button" class="key key-operator" data-operator="-" title="Subtract (-)">−</button>

      <!-- Row 4: 1, 2, 3, Add -->
      <button type="button" class="key key-number" data-number="1">1</button>
      <button type="button" class="key key-number" data-number="2">2</button>
      <button type="button" class="key key-number" data-number="3">3</button>
      <button type="button" class="key key-operator" data-operator="+" title="Add (+)">+</button>

      <!-- Row 5: 0, Decimal, Backspace, Equals -->
      <button type="button" class="key key-number" data-number="0">0</button>
      <button type="button" class="key key-number" data-action="decimal" title="Decimal Point (.)">.</button>
      <button type="button" class="key key-action" data-action="backspace" title="Backspace (⌫)">⌫</button>
      <button type="button" class="key key-equals" data-action="calculate" title="Calculate (= / Enter)">=</button>
    </section>
  </main>

  <!-- Complete Arithmetic Script -->
  <script>
    const state = {
      currentOperand: '0',
      previousOperand: '',
      operation: null,
      shouldResetScreen: false
    };

    const elements = {
      displayCurrent: document.getElementById('currentOperand'),
      displayHistory: document.getElementById('previousOperand'),
      keypad: document.querySelector('.keypad-grid')
    };

    function formatNumber(valueStr) {
      if (valueStr === 'Error' || valueStr === '') return valueStr;
      const parts = valueStr.split('.');
      const intPart = parseFloat(parts[0]);
      const decimalPart = parts[1];

      let formattedInt = '';
      if (isNaN(intPart)) {
        formattedInt = valueStr.startsWith('-') ? '-' : '';
      } else {
        formattedInt = intPart.toLocaleString('en-US', { maximumFractionDigits: 0 });
      }

      return decimalPart !== undefined ? `${formattedInt}.${decimalPart}` : formattedInt;
    }

    function getSymbol(op) {
      switch (op) {
        case '+': return '+';
        case '-': return '−';
        case '*': return '×';
        case '/': return '÷';
        default: return '';
      }
    }

    function updateDisplay() {
      elements.displayCurrent.textContent = formatNumber(state.currentOperand);
      if (state.operation != null) {
        elements.displayHistory.textContent = `${formatNumber(state.previousOperand)} ${getSymbol(state.operation)}`;
      } else {
        elements.displayHistory.textContent = '';
      }
    }

    function appendNumber(num) {
      if (state.shouldResetScreen || state.currentOperand === 'Error') {
        state.currentOperand = '';
        state.shouldResetScreen = false;
      }
      if (state.currentOperand === '0' && num === '0') return;
      if (state.currentOperand === '0' && num !== '.') {
        state.currentOperand = num;
        return;
      }
      if (state.currentOperand.replace(/[^0-9]/g, '').length >= 12) return;
      state.currentOperand += num;
    }

    function appendDecimal() {
      if (state.shouldResetScreen || state.currentOperand === 'Error') {
        state.currentOperand = '0';
        state.shouldResetScreen = false;
      }
      if (state.currentOperand.includes('.')) return;
      state.currentOperand += '.';
    }

    function chooseOperation(op) {
      if (state.currentOperand === 'Error') return;
      if (state.previousOperand !== '' && !state.shouldResetScreen) {
        calculate();
      }
      state.operation = op;
      state.previousOperand = state.currentOperand;
      state.shouldResetScreen = true;
    }

    function calculate() {
      if (state.operation == null || state.previousOperand === '' || state.shouldResetScreen) {
        return;
      }
      const prev = parseFloat(state.previousOperand);
      const current = parseFloat(state.currentOperand);
      if (isNaN(prev) || isNaN(current)) return;

      let result;
      switch (state.operation) {
        case '+': result = prev + current; break;
        case '-': result = prev - current; break;
        case '*': result = prev * current; break;
        case '/':
          if (current === 0) {
            state.currentOperand = 'Error';
            state.previousOperand = '';
            state.operation = null;
            state.shouldResetScreen = true;
            return;
          }
          result = prev / current;
          break;
        default: return;
      }

      state.currentOperand = (Math.round(result * 1e10) / 1e10).toString();
      state.operation = null;
      state.previousOperand = '';
      state.shouldResetScreen = true;
    }

    function clearAll() {
      state.currentOperand = '0';
      state.previousOperand = '';
      state.operation = null;
      state.shouldResetScreen = false;
    }

    function toggleSign() {
      if (state.currentOperand === '0' || state.currentOperand === 'Error') return;
      if (state.currentOperand.startsWith('-')) {
        state.currentOperand = state.currentOperand.slice(1);
      } else {
        state.currentOperand = '-' + state.currentOperand;
      }
    }

    function computePercentage() {
      if (state.currentOperand === '0' || state.currentOperand === 'Error') return;
      const val = parseFloat(state.currentOperand);
      state.currentOperand = (val / 100).toString();
    }

    function deleteLast() {
      if (state.shouldResetScreen || state.currentOperand === 'Error') {
        state.currentOperand = '0';
        return;
      }
      if (state.currentOperand.length > 1) {
        state.currentOperand = state.currentOperand.slice(0, -1);
        if (state.currentOperand === '-') state.currentOperand = '0';
      } else {
        state.currentOperand = '0';
      }
    }

    elements.keypad.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const { number, operator, action } = btn.dataset;

      if (number !== undefined) {
        appendNumber(number);
        updateDisplay();
        return;
      }
      if (operator !== undefined) {
        chooseOperation(operator);
        updateDisplay();
        return;
      }
      if (action !== undefined) {
        switch (action) {
          case 'clear': clearAll(); break;
          case 'toggle-sign': toggleSign(); break;
          case 'percent': computePercentage(); break;
          case 'decimal': appendDecimal(); break;
          case 'backspace': deleteLast(); break;
          case 'calculate': calculate(); break;
        }
        updateDisplay();
      }
    });

    window.addEventListener('keydown', (e) => {
      const { key } = e;
      if (/^[0-9]$/.test(key)) {
        e.preventDefault();
        appendNumber(key);
        updateDisplay();
      } else if (key === '.') {
        e.preventDefault();
        appendDecimal();
        updateDisplay();
      } else if (['+', '-', '*', '/'].includes(key)) {
        e.preventDefault();
        chooseOperation(key);
        updateDisplay();
      } else if (key === 'Enter' || key === '=') {
        e.preventDefault();
        calculate();
        updateDisplay();
      } else if (key === 'Backspace') {
        e.preventDefault();
        deleteLast();
        updateDisplay();
      } else if (key === 'Escape') {
        e.preventDefault();
        clearAll();
        updateDisplay();
      } else if (key === '%') {
        e.preventDefault();
        computePercentage();
        updateDisplay();
      }
    });

    updateDisplay();
  </script>
</body>
</html>
